[package]
name = "mindpipe"
version = "0.1.0"
description = "MindPipe - Visual Knowledge & AI Context Hub"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"

[[bin]]
name = "mindpipe"
path = "src/main.rs"

[lib]
name = "mindpipe_lib"
crate-type = ["staticlib", "cdylib", "lib"]
